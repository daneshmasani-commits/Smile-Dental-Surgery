    <path d="M24 7c8 0 13 4 13 11 0 6-3 9-5 14-1.6 4-1.4 9-3.4 9-2.2 0-2.1-6-4.6-6s-2.4 6-4.6 6c-2 0-1.8-5-3.4-9-2-5-5-8-5-14 0-7 5-11 13-11Z"/>
    <path d="M18.5 14.5c1.8-1.6 9.2-1.6 11 0" stroke-width="2"/>
  </g>
  <!-- Wordmark -->
  <text x="50" y="22" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.3" fill="currentColor">Smile Dental Surgery</text>
  <text x="50" y="38" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="currentColor" opacity="0.7">EAST HAM · LONDON</text>
